[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bbbcp"
version = "0.1.3"
description = "Support-aware conformal prediction for imbalanced molecular screening (RECOMB 2027 working repo)"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "rdkit", "matplotlib", "pyyaml"]

[project.optional-dependencies]
gnn = ["torch", "torch_geometric"]
chemprop = ["chemprop>=2.2"]
extra = ["catboost", "transformers>=4.44,<5"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
